<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Aprende a observar, identificar problemas y comunicar incidencias. 34 casos ilustrados y 34 ejercicios autocorregibles."><title>Revisión y mantenimiento de edificios</title><style>
:root { --page:#faf7f2; --card:#ffffff; --ink:#2b2620; --ink2:#6b6353; --line:#e8e0d2; --accent:#6b4f1d; --warn-bg:#fdf3e3; --warn-line:#d99a2b; --note-bg:#eef5ee; --note-line:#7ba05b; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--page); color: var(--ink); font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 16px; line-height: 1.55; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
.portada { text-align: center; margin: 10px 0 4px; }
.portada img { width: 240px; max-width: 74%; height: auto; }
.portada h1 { font-size: 25px; margin: 14px 0 2px; line-height: 1.2; }
.fact { color: var(--ink2); font-size: 13px; }
.intro { color: var(--ink2); margin: 10px 0 18px; }
.cab { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.cab img { height: 40px; width: auto; }
.cab h1 { font-size: 21px; margin: 0; line-height: 1.25; }
.callout { border-radius: 12px; padding: 12px 16px; margin: 14px 0; font-size: 14.5px; }
.callout b { display: block; margin-bottom: 2px; }
.note { background: var(--note-bg); border: 2px solid var(--note-line); }
.warn { background: var(--warn-bg); border: 2px solid var(--warn-line); }
.seccion { margin-top: 22px; }
.seccion > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); margin: 0 0 10px; font-weight: 600; }
input[type=search] { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
.cats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.cats button { padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink2); font-size: 13.5px; cursor: pointer; }
.cats button.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.ficha-card { display: block; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
.ficha-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #f5efe4; }
.ficha-card-body { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px 16px; }
.ficha-num { flex: none; font-weight: 700; color: var(--accent); font-size: 18px; }
.ficha-title { font-weight: 600; font-size: 16.5px; }
.ficha-meta { margin-top: 2px; color: var(--ink2); font-size: 12.5px; }
.vacio { color: var(--ink2); font-size: 14.5px; padding: 8px 2px; }
.ficha-img { display: block; width: 100%; border-radius: 16px; border: 1px solid var(--line); background: #f5efe4; margin-top: 14px; }
.punto { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.punto p { margin: 0; flex: 1; }
.punto-num { flex: none; font-weight: 700; color: var(--accent); }
.pregunta { background: var(--card); border: 2px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin: 14px 0; font-size: 16px; }
.pregunta b { display: block; color: var(--accent); margin-bottom: 4px; font-size: 17px; }
.btn-sol { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--card); color: var(--accent); font-size: 14.5px; font-weight: 600; cursor: pointer; margin-top: 6px; }
.caption { color: var(--ink2); font-size: 12.5px; margin-top: 8px; }
.volver { display: inline-block; margin-top: 18px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; font-size: 14.5px; }
.pie { margin-top: 30px; color: var(--ink2); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }

[hidden]{display:none!important}.cab{flex-direction:column;align-items:flex-start;margin-bottom:16px}.cab img{height:auto;width:160px}.visual{position:relative;display:block;overflow:hidden;border-radius:16px}.visual img{width:100%;display:block}.legacy img{clip-path:inset(0 0 11% 0);margin-bottom:-8.25%;aspect-ratio:4/3;object-fit:cover}.visual::after{content:'';position:absolute;left:2.5%;bottom:3%;width:8%;max-width:64px;aspect-ratio:82/83;background:url('img/marca.png') center/contain no-repeat;pointer-events:none}.ficha-card .visual{border-radius:0}.ficha-card .legacy{aspect-ratio:4/3}.ficha-card .legacy img{height:calc(100% / .89);aspect-ratio:auto;object-fit:cover}.fuentes{font-size:13px;color:var(--ink2);margin:22px 0}.fuentes a{color:var(--accent);overflow-wrap:anywhere}.btn-hecho{font-size:15px;padding:11px 16px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;cursor:pointer;margin:8px 0}.btn-hecho.sel,.btn-hecho.principal{background:var(--accent);color:white;border-color:var(--accent)}.ya{font-size:13px;color:#4d7a2e;font-weight:600}.datos{background:white;border:1px solid var(--line);padding:16px;border-radius:12px;margin:16px 0}.datos p{margin:8px 0}.ej-card{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;text-decoration:none;color:var(--ink);background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.big{margin:16px 0}.ej-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}fieldset{border:0;padding:0;margin:22px 0 12px;min-width:0}legend{font-size:18px;font-weight:600;padding:0;margin-bottom:12px}.opcion{display:flex;align-items:flex-start;gap:10px;background:white;border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0;cursor:pointer}.opcion input{margin-top:6px;flex-shrink:0;accent-color:var(--accent)}progress{width:100%;accent-color:#6b4f1d}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #805b1b;outline-offset:3px}.callout .volver{margin-top:8px}.progress-note{font-size:13px;color:var(--ink2)}@media(max-width:420px){.cab h1{font-size:21px}}
</style></head><body><main id="app" class="wrap"></main><noscript>Activa JavaScript para ver los casos y ejercicios.</noscript><script src="data.js"></script><script src="app.js"></script><script src="ejercicios.js"></script></body></html>
